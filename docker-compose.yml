version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: parser-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=infini_rag_flow
      - MYSQL_DATABASE=rag_flow
      - MYSQL_USER=rag_flow
      - MYSQL_PASSWORD=infini_rag_flow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pinfini_rag_flow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: parser-redis
    command: redis-server --appendonly yes --requirepass infini_rag_flow
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Elasticsearch (Primary Vector Store)
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: parser-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - action.destructive_requires_name=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network

  # MinIO (Object Storage)
  minio:
    image: minio/minio:latest
    container_name: parser-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=rag_flow
      - MINIO_ROOT_PASSWORD=infini_rag_flow
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

volumes:
  mysql_data:
  redis_data:
  es_data:
  minio_data:

networks:
  rag-network:
    driver: bridge
